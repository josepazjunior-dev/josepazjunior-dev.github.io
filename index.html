<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu sistema de despesas</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #eef2ff;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 15px #0002;
    }

    h1 {
      color: #2563eb;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Meu sistema de despesas</h1>
    <p>Este é meu primeiro site de teste.</p>

    <button onclick="alert('Está funcionando!')">
      Testar
    </button>
  </div>
</body>
</html>
